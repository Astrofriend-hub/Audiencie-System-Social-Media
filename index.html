<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Organic Audience Intelligence System</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#07091a;--pan:rgba(255,255,255,.045);--line:rgba(255,255,255,.1);--vi:#8b5cf6;--vi2:#a78bfa;--gold:#d4b36a;--tx:#eef0fa;--mut:#8c92b3;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(900px 500px at 85% -10%,#2a1b5e55,transparent),var(--bg);color:var(--tx);font:14px/1.5 Manrope,system-ui,sans-serif;display:flex}
button,input,select,textarea{font:inherit;color:inherit}
nav{width:232px;flex:none;border-right:1px solid var(--line);padding:18px 12px;overflow:auto;background:#060817cc;backdrop-filter:blur(14px)}
.brand{font-weight:800;font-size:15px;padding:4px 10px 16px;line-height:1.2}.brand b{color:var(--gold)}
nav a{display:block;padding:9px 12px;border-radius:9px;color:var(--mut);cursor:pointer;font-weight:500}
nav a:hover{background:var(--pan);color:var(--tx)}nav a.on{background:linear-gradient(90deg,#8b5cf633,transparent);color:#fff;box-shadow:inset 2px 0 var(--gold)}
main{flex:1;min-width:0;overflow:auto;padding:26px 30px 60px}
h1{font-size:24px;margin:0 0 4px;font-weight:800}h2{font-size:15px;margin:0 0 12px}.sub{color:var(--mut);margin:0 0 20px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:16px;backdrop-filter:blur(10px);min-width:0}
.kpi b{display:block;font-size:24px;font-weight:800}.kpi span{color:var(--mut);font-size:12px}
.btn{background:var(--vi);border:0;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;transition:.15s}.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn.g{background:var(--pan);border:1px solid var(--line)}.btn.d{background:#f8717122;color:var(--bad);border:1px solid #f8717144}.btn.s{padding:4px 9px;font-size:12px}.btn.gold{background:var(--gold);color:#1a1405}
input,select,textarea{background:#0d1030;border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}input:focus,select:focus,textarea:focus{outline:2px solid var(--vi);border-color:transparent}
textarea{min-height:90px;resize:vertical}label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.bar input,.bar select{width:auto;min-width:130px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600;cursor:pointer;user-select:none}tr:hover td{background:#ffffff08}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid var(--line);background:#ffffff0a}
.b-demo{color:var(--gold);border-color:#d4b36a55}.b-no{color:var(--bad);border-color:#f8717155}.b-ok{color:var(--ok);border-color:#4ade8055}.b-vi{color:var(--vi2);border-color:#a78bfa55}
.sc{font-weight:800}.prog{height:10px;background:#ffffff12;border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--vi),var(--gold));transition:width .3s}
.empty{text-align:center;padding:36px;color:var(--mut)}.empty b{display:block;color:var(--tx);margin-bottom:4px}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.md{background:#0c0f2a;border:1px solid var(--line);border-radius:16px;padding:20px;width:480px;max-width:100%;max-height:90vh;overflow:auto}
#toasts{position:fixed;right:16px;bottom:16px;z-index:99;display:flex;flex-direction:column;gap:8px}.toast{background:#14183a;border:1px solid var(--vi);border-radius:10px;padding:10px 14px;animation:ti .25s}@keyframes ti{from{opacity:0;transform:translateX(20px)}}
.ban{background:#d4b36a14;border:1px solid #d4b36a40;color:var(--gold);padding:8px 12px;border-radius:10px;margin-bottom:16px;font-size:12px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.mut{color:var(--mut)}.dz{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--mut);margin-top:8px}.dz.on{border-color:var(--vi)}
.chips span{display:inline-block;margin:2px}ul{margin:6px 0;padding-left:18px}li{margin:3px 0}canvas{max-height:260px}
@media(max-width:800px){body{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;border:0;padding:8px}.brand{display:none}nav a{white-space:nowrap}main{padding:16px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<nav id="nav"></nav><main id="main"></main><div id="toasts"></div>
<script>
/* ================= STATE + STORAGE ================= */
const CATS=['Fitness','Gym',"Men's Fitness","Men's Lifestyle",'LGBTQ+ Content','Beach','Travel','Fashion','Photography','Wellness','Humor','Self Improvement','Motivation','Other'];
const PLAT=['Instagram','TikTok','X','Threads'],PRI=['Critical','High','Medium','Low'],TYPES=['Reel','Video','Carousel','Image','Text','Thread'],ITYPES=['viewed','like','comment','follow','save','share','profile visit','other'];
const PW={Critical:100,High:75,Medium:50,Low:25};
const KEY='oais.v1';let S;
const uid=p=>p+'_'+Math.random().toString(36).slice(2,9);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(x){toast('Storage full or blocked: '+x.message)}};
function seed(){
 const A=[['Instagram','gymwithalex','Gym','Critical',412000,4.8],['Instagram','beachvibes.co','Beach','High',230000,3.9],['TikTok','fitnessdaily','Fitness','High',880000,6.1],['TikTok','mensstylelab',"Men's Lifestyle",'Medium',150000,5.2],['X','liftnotes','Gym','Medium',64000,1.9],['X','wanderthreads','Travel','Low',48000,1.2],['Threads','prideandpush','LGBTQ+ Content','High',92000,4.4],['Threads','calmreset','Wellness','Medium',71000,3.1],['Instagram','lensandlight','Photography','Medium',305000,2.7],['TikTok','funnygymbros','Humor','Low',520000,7.3],['Instagram','menswearweekly','Fashion','High',187000,3.4],['Threads','growthmindset','Self Improvement','Low',39000,2.2]];
 const H={Gym:['gym','legday','lifting'],Fitness:['fitness','workout'],Beach:['beach','summer'],"Men's Lifestyle":['mensstyle','routine'],Travel:['travel','wander'],'LGBTQ+ Content':['pride','community'],Wellness:['wellness','mindful'],Photography:['photography','golden'],Humor:['funny','memes'],Fashion:['ootd','menswear'],'Self Improvement':['habits','growth']};
 S={profile:{name:'Demo Creator',user:'demo.creator',ig:'',tt:'',x:'',th:'',loc:'',interests:'gym, fitness, travel, routine',cats:['Gym','Fitness','Travel','Beach',"Men's Lifestyle"],tags:'gym, legday, summer, routine',goals:'Grow organic reach with relevant communities'},accounts:[],posts:[],opps:{},inter:[],exps:[],queue:[],log:[],settings:{batch:5,defPlat:'Instagram'}};
 A.forEach((a,i)=>{const id=uid('a');S.accounts.push({id,platform:a[0],user:a[1],url:'',cat:a[2],pri:a[3],aud:a[4],eng:a[5],status:i<8?'Analyzed':'Pending',last:i<8?new Date(Date.now()-i*864e5).toISOString().slice(0,10):'',demo:1});
  for(let k=0;k<2;k++){const v=20000+((i*7919+k*104729)%180000),l=Math.round(v*(.03+((i+k)%5)*.012));S.posts.push({id:uid('p'),acc:a[1],platform:a[0],url:'',type:TYPES[(i+k)%6],caption:'Demo post about '+a[2].toLowerCase()+' #'+k,tags:H[a[2]].join(', '),views:v,likes:l,comments:Math.round(l*.06),shares:Math.round(l*.04),saves:Math.round(l*.1),cat:a[2],topic:H[a[2]][0],demo:1})}});
 const d=n=>new Date(Date.now()-n*864e5).toISOString().slice(0,10);
 [['like','Positive',1],['comment','Positive',2],['follow','Neutral',3],['save','Positive',3],['viewed','No response',5],['comment','Positive',6],['like','Neutral',8],['follow','Positive',9]].forEach((x,i)=>{const a=S.accounts[i];S.inter.push({id:uid('i'),date:d(x[2]),platform:a.platform,acc:a.user,cat:a.cat,content:'Demo content',type:x[0],result:x[1],notes:'',demo:1})});
 S.exps.push({id:uid('x'),hyp:'Question hooks beat statements',variable:'Hook',exp:'+15% saves',act:'+22% saves',winner:'Question hook',demo:1},{id:uid('x'),hyp:'Evening posts get more comments',variable:'Schedule',exp:'+10% comments',act:'',winner:'',demo:1});
 S.log.push({t:Date.now(),m:'Demo data loaded',demo:1});save()}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(x){}if(!S||!S.accounts)seed();

/* ================= UTIL / UI ================= */
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toasts').append(t);setTimeout(()=>t.remove(),3200)}
function logA(m){S.log.unshift({t:Date.now(),m});S.log=S.log.slice(0,40);save()}
function modal(title,body){close();const o=document.createElement('div');o.className='ov';o.id='ov';o.onclick=ev=>{if(ev.target==o)close()};o.innerHTML=`<div class="md"><div class="row"><h2>${e(title)}</h2><button class="btn g s" onclick="close()">✕</button></div>${body}</div>`;document.body.append(o)}
function close(){const o=$('#ov');if(o)o.remove()}
function ask(msg,fn){modal('Confirm',`<p>${e(msg)}</p><div class="row"><span></span><span><button class="btn g" onclick="close()">Cancel</button> <button class="btn d" id="yes">Confirm</button></span></div>`);$('#yes').onclick=()=>{close();fn()}}
function form(title,fields,vals,onSave){
 modal(title,'<div id="ff">'+fields.map(f=>{const[k,l,t,o]=f,v=vals[k]??'';let i;
  if(t=='sel')i=`<select name="${k}">${o.map(x=>`<option ${x==v?'selected':''}>${e(x)}</option>`).join('')}</select>`;
  else if(t=='area')i=`<textarea name="${k}">${e(v)}</textarea>`;
  else i=`<input name="${k}" type="${t=='num'?'number':'text'}" value="${e(v)}">`;
  return `<label>${l}</label>${i}`}).join('')+'</div><p id="fe" style="color:var(--bad)"></p><button class="btn" id="sv">Save</button>');
 $('#sv').onclick=()=>{const r={};document.querySelectorAll('#ff [name]').forEach(n=>r[n.name]=n.type=='number'?(n.value===''?'':+n.value):n.value.trim());const err=onSave(r);if(err)$('#fe').textContent=err;else close()}}
const sc=n=>`<span class="sc" style="color:${n>=75?'var(--ok)':n>=50?'var(--gold)':'var(--mut)'}">${n}</span>`;
const empty=(t,s)=>`<div class="empty"><b>${t}</b>${s||''}</div>`;
const dl=(name,txt,type='application/json')=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()};
const nrm=s=>String(s).toLowerCase().replace(/[^a-z]/g,'');

/* ================= SCORING (DEMO / LOCAL) — replace with backend/AI worker later ================= */
function affinity(cat,tags){const P=S.profile,pc=(P.cats||[]).map(nrm),c=nrm(cat);let s=pc.some(x=>x&&(c.includes(x)||x.includes(c)))?60:15;
 const kw=(P.interests+','+P.tags).toLowerCase().split(/[,#\s]+/).filter(Boolean);const tg=String(tags).toLowerCase().split(/[,#\s]+/).filter(Boolean);
 s+=Math.min(40,tg.filter(t=>kw.some(k=>k.includes(t)||t.includes(k))).length*13);return Math.min(100,s)}
const er=p=>p.views?+((p.likes+p.comments+p.shares+p.saves)/p.views*100).toFixed(2):0;
function postScore(p){const a=affinity(p.cat,p.tags+','+p.topic),en=er(p),pr=PW[(S.accounts.find(x=>x.user==p.acc)||{}).pri]||50;
 const o=Math.round(a*.45+Math.min(en*8,100)*.3+pr*.25);return{aff:a,opp:Math.min(100,o),eng:en,content:Math.min(100,Math.round(en*9))}}
function accScore(a){const aff=affinity(a.cat,a.cat),o=Math.round(aff*.45+Math.min((a.eng||0)*14,100)*.3+(PW[a.pri]||50)*.25);return{aff,opp:Math.min(100,o),content:Math.min(100,Math.round((a.eng||0)*12))}}
function reasons(p,s){const r=[];if(s.aff>=75)r.push('High thematic match with your profile');else if(s.aff>=45)r.push('Partial thematic match');if(s.eng>=6)r.push('Strong engagement ('+s.eng+'%)');const a=S.accounts.find(x=>x.user==p.acc);if(a&&['Critical','High'].includes(a.pri))r.push(a.pri+'-priority reference account');if((S.profile.cats||[]).some(c=>nrm(c)==nrm(p.cat)))r.push('Category in your core list');return r.length?r:['Low signal — review manually']}
const opps=()=>S.posts.map(p=>({p,s:postScore(p)})).filter(o=>S.opps[o.p.id]!='dismissed').sort((a,b)=>b.s.opp-a.s.opp);

/* ================= ACCOUNTS ================= */
const cid=a=>a.platform+':'+(a.uid||a.user.toLowerCase());
function detect(line,def){let l=line.trim(),pl=def,u=l;const m=[[/instagram\.com/i,'Instagram'],[/tiktok\.com/i,'TikTok'],[/(twitter|x)\.com/i,'X'],[/threads\.(net|com)/i,'Threads']];
 m.forEach(([r,p])=>{if(r.test(l)){pl=p;u=l.replace(/[?#].*$/,'').replace(/\/+$/,'').split('/').pop()}});return[pl,u.replace(/^@/,'')]}
function importText(txt,def){const seen=new Set(S.accounts.map(cid)),res={ok:0,dup:0,err:[]};const added=[];
 txt.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach((line,i)=>{try{let pl,u,cat='Other',pri='Medium';const parts=line.split(/[,;\t]/).map(x=>x.trim());
  const pm=PLAT.find(p=>p.toLowerCase()==(parts[0]||'').toLowerCase());
  if(pm){pl=pm;u=(parts[1]||'').replace(/^@/,'');cat=CATS.find(c=>c==parts[2])||cat;pri=PRI.find(c=>c==parts[3])||pri}else if(parts.length>1){[pl,u]=detect(parts[0],def);cat=CATS.find(c=>c==parts[1])||cat;pri=PRI.find(c=>c==parts[2])||pri}else[pl,u]=detect(line,def);
  if(u.toLowerCase()=='username')return;if(!/^[a-z0-9._]{1,40}$/i.test(u)){res.err.push(`Line ${i+1}: invalid username "${line.slice(0,40)}"`);return}
  const a={id:uid('a'),platform:pl,user:u,url:'',cat,pri,aud:'',eng:'',status:'Pending',last:''};const c=cid(a);if(seen.has(c)){res.dup++;return}seen.add(c);added.push(a);res.ok++}catch(x){res.err.push(`Line ${i+1}: ${x.message}`)}});
 S.accounts.push(...added);added.forEach(a=>S.queue.push({id:a.id,st:'pending'}));logA(`Imported ${res.ok} accounts (${res.dup} duplicates skipped)`);save();return res}
const AF=[['platform','Platform','sel',PLAT],['user','Username','text'],['url','Profile URL','text'],['cat','Category','sel',CATS],['pri','Priority','sel',PRI],['aud','Followers / audience metric','num'],['eng','Engagement %','num']];
function accForm(id){const a=id?S.accounts.find(x=>x.id==id):{platform:S.settings.defPlat,cat:'Other',pri:'Medium'};
 form(id?'Edit account':'Add account',AF,a,r=>{r.user=r.user.replace(/^@/,'');if(!/^[a-z0-9._]{1,40}$/i.test(r.user))return 'Username must be 1–40 letters, numbers, dots or underscores.';
  if(S.accounts.some(x=>x.id!=id&&cid(x)==cid({platform:r.platform,user:r.user})))return 'This account already exists (duplicate canonical_account_id).';
  if(id)Object.assign(a,r);else{const n={id:uid('a'),status:'Pending',last:'',...r};S.accounts.push(n);S.queue.push({id:n.id,st:'pending'})}logA((id?'Edited ':'Added ')+r.user);save();toast('Account saved');go()})}
let AV={q:'',pl:'',cat:'',sort:'user',dir:1,page:0,sel:new Set()};

/* ================= PROCESSING (demo worker) — real workers would live in a backend queue ================= */
let timer=null,PR={state:'idle',t0:0};
function tick(){const pend=S.queue.filter(q=>q.st=='pending');if(!pend.length){stopP('idle');toast('Queue completed');return}
 pend.slice(0,+S.settings.batch||5).forEach(q=>{const a=S.accounts.find(x=>x.id==q.id);if(!a){q.st='failed';return}
  if(Math.random()<.06){q.st='failed';a.status='Failed'}else{q.st='done';a.status='Analyzed';a.last=new Date().toISOString().slice(0,10);if(a.eng==='')a.eng=+(1+Math.random()*6).toFixed(1)}});save();if(cur=='processing')go()}
function stopP(s){clearInterval(timer);timer=null;PR.state=s;if(cur=='processing')go()}
const PA={start(){if(!S.queue.some(q=>q.st=='pending')){toast('Nothing pending. Import or add accounts first.');return}PR={state:'running',t0:Date.now()};timer=setInterval(tick,900);logA('Processing started (demo)');go()},pause(){stopP('paused')},resume(){PR.state='running';timer=setInterval(tick,900);go()},clear(){ask('Clear the entire queue?',()=>{stopP('idle');S.queue=[];save();go()})},queueAll(){S.accounts.forEach(a=>{if(!S.queue.some(q=>q.id==a.id&&q.st!='done'))S.queue.push({id:a.id,st:'pending'})});save();go()},retry(){S.queue.forEach(q=>{if(q.st=='failed')q.st='pending'});save();go()}};

/* ================= VIEWS ================= */
let cur='dashboard',charts=[];const NAV=[['dashboard','Dashboard'],['profile','My Profile'],['accounts','Reference Accounts'],['discovery','Discovery'],['content','Content Intelligence'],['engine','Opportunity Engine'],['today',"Today's Opportunities"],['tracker','Interaction Tracker'],['lab','Content Lab'],['experiments','Experiments'],['analytics','Analytics'],['processing','Processing Center'],['connections','Platform Connections'],['settings','Settings']];
function go(v){if(v)cur=v;$('#nav').innerHTML='<div class="brand">Organic Audience<br><b>Intelligence System</b></div>'+NAV.map(n=>`<a class="${n[0]==cur?'on':''}" onclick="go('${n[0]}')">${n[1]}</a>`).join('');
 charts.forEach(c=>c.destroy());charts=[];$('#main').innerHTML=V[cur]();if(AR[cur])AR[cur]();$('#main').scrollTop=0}
const head=(t,s,x='')=>`<div class="row"><div><h1>${t}</h1><p class="sub">${s}</p></div><div>${x}</div></div>`;
const demoBan=()=>S.accounts.some(a=>a.demo)||S.posts.some(a=>a.demo)?'<div class="ban">Demo data loaded. Scores are DEMO / LOCAL SCORING, not data from any platform API.</div>':'';
const chart=(id,type,labels,data,label,colors)=>{const c=document.getElementById(id);if(!c)return;charts.push(new Chart(c,{type,data:{labels,datasets:[{label,data,backgroundColor:colors||['#8b5cf6','#d4b36a','#4ade80','#38bdf8','#f472b6','#fb923c','#a78bfa'],borderColor:type=='line'?'#8b5cf6':'transparent',tension:.35}]},options:{plugins:{legend:{labels:{color:'#8c92b3'},display:type=='doughnut'}},scales:type=='doughnut'?{}:{x:{ticks:{color:'#8c92b3'},grid:{display:false}},y:{ticks:{color:'#8c92b3'},grid:{color:'#ffffff10'}}}}}))};
const count=(arr,f)=>{const m={};arr.forEach(x=>{const k=f(x);m[k]=(m[k]||0)+1});return m};
const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
const best=(m)=>Object.entries(m).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—';
const oppRow=(o,full)=>`<div class="card" style="margin-bottom:10px"><div class="row"><div><b>@${e(o.p.acc)}</b> <span class="badge">${o.p.platform}</span> <span class="badge b-vi">${e(o.p.cat)}</span> <span class="badge b-demo">DEMO / LOCAL SCORING</span><br><span class="mut">${e(o.p.caption)}</span></div><div style="text-align:right">Affinity ${sc(o.s.aff)} · Opportunity ${sc(o.s.opp)}<br><span class="mut">Engagement ${o.s.eng}%</span></div></div>
<ul>${reasons(o.p,o.s).map(r=>`<li>${e(r)}</li>`).join('')}</ul><p class="mut">Suggestion: engage manually only if it fits your voice. Nothing is executed automatically.</p>
${full?`<button class="btn s g" onclick="A.view('${o.p.id}')">VIEW</button> <button class="btn s g" onclick="A.saveO('${o.p.id}')">${S.opps[o.p.id]=='saved'?'SAVED ✓':'SAVE'}</button> <button class="btn s d" onclick="A.dismiss('${o.p.id}')">DISMISS</button> <button class="btn s" onclick="A.logFrom('${o.p.id}')">LOG INTERACTION</button>`:''}</div>`;
const V={
dashboard(){const ac=S.accounts,po=S.posts,O=opps(),ps=po.map(postScore),done=ac.filter(a=>a.status=='Analyzed').length;
 const pt=count(O.filter(o=>o.s.opp>=60),o=>o.p.cat),pp={};po.forEach((p,i)=>{pp[p.platform]=(pp[p.platform]||0)+ps[i].eng});
 const q=S.queue.filter(x=>x.st=='pending').length;
 const K=[['Reference accounts',ac.length],['Accounts processed',done],['Content analyzed',po.length],['Opportunities found',O.filter(o=>o.s.opp>=60).length],['Interactions logged',S.inter.length],['Avg affinity',avg(ps.map(s=>s.aff))],['Avg opportunity',avg(ps.map(s=>s.opp))],['Best topic',best(pt)],['Best platform',best(pp)],['Queue pending',q]];

delPost(id){ask('Delete this post?',()=>{S.posts=S.posts.filter(p=>p.id!=id);save();go()})},
view(id){const p=S.posts.find(x=>x.id==id);p.url?window.open(p.url,'_blank','noopener'):modal('Post',`<p><b>@${e(p.acc)}</b> on ${p.platform}</p><p>${e(p.caption)}</p><p class="mut">No URL stored for this post. Add one with Content Intelligence → Edit.</p>`)},
saveO(id){S.opps[id]=S.opps[id]=='saved'?'':'saved';save();go()},dismiss(id){S.opps[id]='dismissed';save();toast('Dismissed');go()},
logFrom(id){const p=S.posts.find(x=>x.id==id);A.logI({platform:p.platform,acc:p.acc,content:p.caption.slice(0,60)})},
logI(v={}){form('Log interaction',[['date','Date','text'],['platform','Platform','sel',PLAT],['acc','Account','text'],['content','Content','text'],['type','Type','sel',ITYPES],['result','Result','sel',['Positive','Neutral','No response']],['notes','Notes','area']],{date:new Date().toISOString().slice(0,10),type:'viewed',result:'Neutral',...v},r=>{if(!r.acc)return 'Account is required.';if(!/^\d{4}-\d{2}-\d{2}$/.test(r.date))return 'Date format: YYYY-MM-DD.';const a=S.accounts.find(x=>x.user==r.acc.replace(/^@/,''));S.inter.push({id:uid('i'),...r,acc:r.acc.replace(/^@/,''),cat:a?a.cat:'Other'});logA(`Logged ${r.type} on @${r.acc}`);save();toast('Interaction logged');go()})},
delI(id){ask('Delete this interaction?',()=>{S.inter=S.inter.filter(i=>i.id!=id);save();go()})},
exp(id){const x=id?S.exps.find(y=>y.id==id):{};form(id?'Edit experiment':'New experiment',[['hyp','Hypothesis','text'],['variable','Variable','sel',['Hook','Caption','Format','Schedule','Topic','Hashtags','Style']],['exp','Expected result','text'],['act','Actual result','text'],['winner','Winner','text']],x,r=>{if(!r.hyp)return 'Hypothesis is required.';id?Object.assign(x,r):S.exps.push({id:uid('x'),...r});save();go()})},
delX(id){ask('Delete experiment?',()=>{S.exps=S.exps.filter(x=>x.id!=id);save();go()})},
gen(){const idea=$('#idea').value.trim();if(!idea)return toast('Write an idea first');const tag=idea.toLowerCase().split(/\W+/).filter(w=>w.length>3).slice(0,3),tg=(n)=>tag.concat(['fyp','creator']).slice(0,n).map(t=>'#'+t).join(' ');
 const hook=`Nobody tells you this about ${idea.toLowerCase()}.`,cta={Instagram:'Save this for later and send it to a friend.',TikTok:'Follow for part 2.',X:'Agree or disagree? Reply below.',Threads:'What would you add? Join the conversation.'};
 $('#labout').innerHTML=PLAT.map(p=>`<div class="card"><div class="row"><h2>${p}</h2><span class="badge b-demo">LOCAL TEMPLATE</span></div><b>Hook:</b> ${e(hook)}<br><b>Short:</b> ${e(idea.slice(0,p=='X'?200:90))}<br><b>Long:</b> ${e(idea)}. Here is what matters, why it works, and the one thing to try today.<br><b>Caption:</b> ${e(hook)} ${e(idea)}<br><b>CTA:</b> ${cta[p]}<br><b>Hashtags:</b> ${e(tg(p=='X'||p=='Threads'?2:5))}</div>`).join('')},
clearDemo(){ask('Remove only demo data?',()=>{S.accounts=S.accounts.filter(a=>!a.demo);S.posts=S.posts.filter(a=>!a.demo);S.inter=S.inter.filter(a=>!a.demo);S.exps=S.exps.filter(a=>!a.demo);const ids=new Set(S.accounts.map(a=>a.id));S.queue=S.queue.filter(q=>ids.has(q.id));S.log=S.log.filter(l=>!l.demo);save();toast('Demo data cleared');go()})},
reset(){ask('Erase ALL data?',()=>{localStorage.removeItem(KEY);S=null;seed();go()})},
importJSON(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.accounts||!d.profile)throw Error('Not a valid backup file');S=d;save();toast('Backup imported');go()}catch(x){toast('Import failed: '+x.message)}};r.readAsText(i.files[0])};i.click()}};
window.addEventListener('error',ev=>toast('Error: '+ev.message));
go();
</script></body></html>
